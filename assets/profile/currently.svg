<svg width="1200" height="210" viewBox="0 0 1200 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">04 / Currently</title>
  <desc id="desc">Building Cloudflare developer tools, testing deployment workflows, and maintaining TypeScript open source</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="12" x2="1176" y2="204" gradientUnits="userSpaceOnUse">
      <stop stop-color="#100C29"/><stop offset=".52" stop-color="#281452"/><stop offset="1" stop-color="#151034"/>
    </linearGradient>
    <linearGradient id="line" x1="72" y1="56" x2="1128" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9A8D4"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#C4B5FD" stroke-opacity=".05"/>
    </pattern>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="210" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="210" fill="url(#bg)"/>
    <rect width="1200" height="210" fill="url(#grid)"/>
    <text x="40" y="40" fill="#F9A8D4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="3">04 / CURRENTLY</text>

    <path d="M162 114H438M600 114H762M924 114H1038" stroke="url(#line)" stroke-opacity=".28" stroke-width="2" stroke-dasharray="4 8"/>

    <g transform="translate(72 76)">
      <circle cx="22" cy="22" r="21" stroke="url(#line)" stroke-opacity=".55"/>
      <path d="M11 22H33M22 11V33" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" filter="url(#soft)"/>
      <text x="58" y="16" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2">BUILDING</text>
      <text x="58" y="42" fill="#FAF5FF" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Cloudflare developer tools</text>
    </g>

    <g transform="translate(438 76)">
      <circle cx="22" cy="22" r="21" stroke="url(#line)" stroke-opacity=".55"/>
      <path d="M11 22L19 30L34 14" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
      <text x="58" y="16" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2">TESTING</text>
      <text x="58" y="42" fill="#FAF5FF" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Deployment workflows</text>
    </g>

    <g transform="translate(808 76)">
      <circle cx="22" cy="22" r="21" stroke="url(#line)" stroke-opacity=".55"/>
      <path d="M13 16L6 22L13 28M31 16L38 22L31 28M25 11L19 33" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
      <text x="58" y="16" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2">MAINTAINING</text>
      <text x="58" y="42" fill="#FAF5FF" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">TypeScript open source</text>
    </g>

    <g fill="#FAF5FF" filter="url(#soft)">
      <circle cx="398" cy="114" r="3"/><circle cx="768" cy="114" r="3"/><circle cx="1136" cy="114" r="3"/>
