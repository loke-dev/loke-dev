<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Loke</title>
  <desc id="desc">Crafting sharp tools for the cloud and the web</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="22" x2="1120" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#100C29"/>
      <stop offset="0.42" stop-color="#24124F"/>
      <stop offset="0.75" stop-color="#3B176E"/>
      <stop offset="1" stop-color="#19133D"/>
    </linearGradient>
    <linearGradient id="aurora" x1="255" y1="-20" x2="845" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F472B6" stop-opacity=".78"/>
      <stop offset=".38" stop-color="#A855F7" stop-opacity=".42"/>
      <stop offset=".72" stop-color="#6366F1" stop-opacity=".24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="80" x2="1040" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9A8D4"/>
      <stop offset=".5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(875 155) rotate(151) scale(390 235)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity=".4"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#C4B5FD" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="400" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <ellipse cx="466" cy="46" rx="440" ry="128" fill="url(#aurora)" filter="url(#blur)" transform="rotate(-8 466 46)"/>
    <ellipse cx="872" cy="154" rx="390" ry="235" fill="url(#glow)"/>

    <g opacity=".75">
      <circle cx="91" cy="82" r="2" fill="#F9A8D4"/>
      <circle cx="165" cy="301" r="1.5" fill="#C4B5FD"/>
      <circle cx="1095" cy="95" r="2" fill="#67E8F9"/>
      <circle cx="1020" cy="285" r="1.5" fill="#F9A8D4"/>
      <circle cx="960" cy="58" r="1" fill="#C4B5FD"/>
      <circle cx="259" cy="69" r="1" fill="#67E8F9"/>
      <circle cx="1122" cy="236" r="1" fill="#C4B5FD"/>
    </g>

    <path d="M0 346L122 261L202 304L332 183L432 291L553 226L680 319L804 210L941 299L1064 213L1200 287V400H0V346Z" fill="#171033" fill-opacity=".78"/>
    <path d="M0 375L136 292L248 352L374 256L497 343L624 278L763 352L895 267L1010 338L1120 282L1200 332V400H0V375Z" fill="#0E0A22"/>
    <path d="M0 346L122 261L202 304L332 183L432 291L553 226L680 319L804 210L941 299L1064 213L1200 287" stroke="url(#line)" stroke-opacity=".3"/>

    <g transform="translate(102 85)">
      <path d="M0 0H64M0 0V64M0 64H34" stroke="url(#line)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)"/>
      <path d="M58 64H92M92 64V30M92 30H65M92 30L113 9" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
      <text x="0" y="155" fill="#FAF5FF" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="96" font-weight="800" letter-spacing="12">LOKE</text>
      <rect y="181" width="88" height="4" rx="2" fill="url(#line)"/>
      <text x="0" y="225" fill="#DDD6FE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="500" letter-spacing="1">crafting sharp tools for the cloud &amp; the web</text>
    </g>

    <g transform="translate(975 106)" opacity=".9">
      <circle cx="54" cy="54" r="53" stroke="url(#line)" stroke-opacity=".35"/>
      <circle cx="54" cy="54" r="38" stroke="url(#line)" stroke-opacity=".2"/>
      <path d="M54 16V92M35 35H72L35 73H73" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="398" rx="27" stroke="url(#line)" stroke-opacity=".22" stroke-width="2"/>
</svg>
