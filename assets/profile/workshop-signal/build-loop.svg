<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Loke's build loop</title>
  <desc id="desc">A simple loop from idea to build, test, ship, and learn.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#121212" stroke-opacity=".1" />
    </pattern>
    <linearGradient id="signal" x1="180" y1="182" x2="1020" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff5a1f" />
      <stop offset="1" stop-color="#ff7a42" />
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="280" rx="24" /></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="#f4f0e8" />
    <rect width="1200" height="280" fill="url(#grid)" />
    <text x="42" y="44" fill="#ff5a1f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3">02 / HOW I BUILD</text>

    <path d="M144 146H1030" stroke="#121212" stroke-opacity=".14" stroke-width="2" stroke-dasharray="4 9" />
    <path d="M164 146C164 94 208 78 260 78H936C988 78 1036 101 1036 146C1036 194 988 212 936 212H260C208 212 164 194 164 146Z" fill="none" stroke="url(#signal)" stroke-linecap="round" stroke-width="8" />
    <path d="M1036 146l-22-15v30l22-15Z" fill="#ff5a1f" />

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#121212">
      <g transform="translate(205 61)"><circle cx="0" cy="0" r="15" fill="#ff5a1f" /><text x="-29" y="53">IDEA</text></g>
      <g transform="translate(420 61)"><circle cx="0" cy="0" r="15" fill="#ff5a1f" /><text x="-37" y="53">BUILD</text></g>
      <g transform="translate(635 61)"><circle cx="0" cy="0" r="15" fill="#ff5a1f" /><text x="-35" y="53">TEST</text></g>
      <g transform="translate(850 212)"><circle cx="0" cy="0" r="15" fill="#ff5a1f" /><text x="-35" y="-29">SHIP</text></g>
      <g transform="translate(530 212)"><circle cx="0" cy="0" r="15" fill="#ff5a1f" /><text x="-43" y="-29">LEARN</text></g>
    </g>

    <path d="M330 146H450L470 119L494 174L520 132H664" fill="none" stroke="#6d90ac" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" />
    <circle cx="680" cy="146" r="11" fill="#121212" />
    <text x="42" y="253" fill="#121212" fill-opacity=".62" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Keep the loop small. Learn from the last release. Then do it again.</text>
  </g>
  <rect x="1" y="1" width="1198" height="278" rx="23" fill="none" stroke="#121212" stroke-opacity=".24" stroke-width="2" />
</svg>
